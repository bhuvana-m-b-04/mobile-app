apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-tracker-frontend
  labels:
    app: login-tracker
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login-tracker
      component: frontend
  template:
    metadata:
      labels:
        app: login-tracker
        component: frontend
    spec:
      containers:
        - name: frontend
          image: placeholder  # replaced by CI pipeline on deploy
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: login-tracker-frontend
  labels:
    app: login-tracker
    component: frontend
spec:
  selector:
    app: login-tracker
    component: frontend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: login-tracker-frontend
  labels:
    app: login-tracker
    component: frontend
spec:
  to:
    kind: Service
    name: login-tracker-frontend
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
